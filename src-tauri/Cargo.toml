[package]
name = "dnsmesh-app"
version = "0.1.0-alpha.11"
description = "Tauri client (desktop + Android) for the DNS Mesh Protocol"
authors = ["Oscar Valenzuela"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dnsmesh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# DMP SDK — path-based for local development. The two repos are sibling
# clones on the dev machine. For production / CI builds, swap these to
# `git = "ssh://git@github.com/oscarvalenzuelab/dnsmesh-rs.git", tag = "sdk-v0.1.0"`
# (or whatever the current sdk-v* tag is). See CONTRIBUTING.md.
dnsmesh-core = { path = "../../dnsmesh-rs/crates/dnsmesh-core" }
dnsmesh-net = { path = "../../dnsmesh-rs/crates/dnsmesh-net" }
dnsmesh-storage = { path = "../../dnsmesh-rs/crates/dnsmesh-storage" }
dnsmesh-client = { path = "../../dnsmesh-rs/crates/dnsmesh-client" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
parking_lot = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
serde_yaml = "0.9"
rpassword = "7"
base64 = "0.22"
# Per-identity KDF salt minting at create time. Already a transitive
# dep via x25519-dalek; pulled in directly for thread_rng().
rand = "0.8"
# At-rest encryption for the per-identity JSONL files. Same primitive and
# version the SDK already uses, so nothing new enters the dependency graph.
chacha20poly1305 = "0.10"
# Passphrase stretching for the backup archive, which is keyed independently
# of any identity. Same version the SDK uses.
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }


# HTTPS client for the M9.2 TSIG-register dance (challenge / sign /
# confirm) against a multi-tenant DMP node. `rustls-tls` keeps us off
# the system openssl. `json` brings in serde-driven request/response
# bodies so the call site stays tidy.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Per-identity backup archive (export / import). `tar` for the
# uncompressed entry layout; `flate2` (already a transitive dep through
# tauri's plugins) for gzip wrapping so the on-disk artefact is a single
# `.dmp-backup.tar.gz` file the user can stash in a vault.
tar = "0.4"
flate2 = "1"

# OS credential store for the TSIG secret, per platform.
#
# The backend features are NOT optional extras: without them keyring
# compiles fine and falls through to an in-memory `mock` that persists
# nothing (keyring/src/lib.rs — every platform arm is gated on its feature,
# with `pub use mock as default` otherwise). Enabling them per target also
# keeps the Secret Service / dbus stack out of macOS and Windows builds.
#
# Android is absent on purpose: keyring has no backend for it at all, so it
# would silently be that same mock. It uses the sealed-file path instead.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
# `test` brings in tauri's mock runtime, which lets the end-to-end tests
# build a real App with managed state and call the actual #[tauri::command]
# functions instead of re-implementing their bodies.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Used only to forge a pre-encryption database in the end-to-end tests.
# Feature unification makes this the same SQLCipher-linked build the SDK
# uses, so opening with no key yields a genuine plaintext file.
rusqlite = "0.32"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
